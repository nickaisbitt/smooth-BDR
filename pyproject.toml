[project]
name = "smooth-ai-bdr"
version = "0.1.0"
description = "Front half of the Smooth AI BDR pipeline: discover, audit, feed outsend"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "beautifulsoup4>=4.12"]

[project.scripts]
sab = "smooth_ai_bdr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
